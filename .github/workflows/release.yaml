---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release

on:
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: macOS release
    runs-on: macos-26
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      APP_NAME: WoodSweep
      PROJECT: WoodSweep.xcodeproj
      SCHEME: WoodSweep
      APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}

    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Import Developer ID Application certificate
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}

      - name: Download Developer ID provisioning profile
        uses: apple-actions/download-provisioning-profiles@2126b5f86a0e2863cbf4d2d312112b22b943a594 # v6.1.0
        with:
          bundle-id: au.edu.vic.woodleigh.WoodSweep
          profile-type: MAC_APP_DIRECT
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Validate release version
        run: |
          VERSION="${RELEASE_TAG#v}"
          grep -Fqx "MARKETING_VERSION = ${VERSION} // x-release-please-version" Config/Version.xcconfig

      - name: Archive app
        run: |
          xcodebuild \
            -project "${PROJECT}" \
            -scheme "${SCHEME}" \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "${RUNNER_TEMP}/${APP_NAME}.xcarchive" \
            DEVELOPMENT_TEAM="SMLKBTR495" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            PROVISIONING_PROFILE_SPECIFIER="WoodSweep" \
            archive

      - name: Export app
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath "${RUNNER_TEMP}/${APP_NAME}.xcarchive" \
            -exportPath "${RUNNER_TEMP}/export" \
            -exportOptionsPlist Config/ExportOptions.plist

      - name: Notarize app
        env:
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          APP_PATH="${RUNNER_TEMP}/export/${APP_NAME}.app"
          NOTARY_ARCHIVE="${RUNNER_TEMP}/${APP_NAME}-notary.zip"
          NOTARY_KEY_PATH="${RUNNER_TEMP}/AuthKey.p8"

          trap 'rm -f "${NOTARY_ARCHIVE}" "${NOTARY_KEY_PATH}"' EXIT

          printf '%s' "${APPSTORE_API_PRIVATE_KEY}" > "${NOTARY_KEY_PATH}"
          chmod 600 "${NOTARY_KEY_PATH}"

          ditto -c -k --keepParent "${APP_PATH}" "${NOTARY_ARCHIVE}"

          xcrun notarytool submit "${NOTARY_ARCHIVE}" \
            --key "${NOTARY_KEY_PATH}" \
            --key-id "${APPSTORE_API_KEY_ID}" \
            --issuer "${APPSTORE_ISSUER_ID}" \
            --wait

          xcrun stapler staple "${APP_PATH}"
          xcrun stapler validate "${APP_PATH}"

      - name: Verify app
        run: |
          APP_PATH="${RUNNER_TEMP}/export/${APP_NAME}.app"

          codesign --verify --deep --strict --verbose=2 "${APP_PATH}"
          spctl --assess --type execute --verbose=2 "${APP_PATH}"

      - name: Create ZIP
        run: |
          VERSION="${RELEASE_TAG#v}"

          mkdir -p dist
          ditto -c -k --keepParent \
            "${RUNNER_TEMP}/export/${APP_NAME}.app" \
            "dist/${APP_NAME}-${VERSION}.zip"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          gh release upload \
            "${RELEASE_TAG}" \
            "dist/${APP_NAME}-${VERSION}.zip" \
            --clobber
