---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release

on:
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build macOS release
    runs-on: macos-26
    permissions:
      contents: write
    env:
      APP_NAME: WoodSweep
      PROJECT: WoodSweep.xcodeproj
      SCHEME: WoodSweep
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Import Developer ID certificate
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7
        with:
          p12-file-base64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          p12-password: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}

      - name: Archive
        run: |
          ARCHIVE_PATH="${RUNNER_TEMP}/WoodSweep.xcarchive"
          xcodebuild \
            -project "${PROJECT}" \
            -scheme "${SCHEME}" \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "${ARCHIVE_PATH}" \
            clean archive

      - name: Export Developer ID app
        run: |
          ARCHIVE_PATH="${RUNNER_TEMP}/WoodSweep.xcarchive"
          EXPORT_PATH="${RUNNER_TEMP}/export"
          xcodebuild \
            -exportArchive \
            -archivePath "${ARCHIVE_PATH}" \
            -exportPath "${EXPORT_PATH}" \
            -exportOptionsPlist Config/ExportOptions.plist

      - name: Notarize app
        env:
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
        run: |
          EXPORT_PATH="${RUNNER_TEMP}/export"
          NOTARY_KEY_PATH="${RUNNER_TEMP}/AuthKey.p8"
          APP_PATH="${EXPORT_PATH}/${APP_NAME}.app"
          ZIP_PATH="${RUNNER_TEMP}/${APP_NAME}.zip"
          trap 'rm -f "${ZIP_PATH}" "${NOTARY_KEY_PATH}"' EXIT

          printf '%s' "${NOTARY_KEY_BASE64}" | base64 -D > "${NOTARY_KEY_PATH}"
          chmod 600 "${NOTARY_KEY_PATH}"
          ditto -c -k --keepParent "${APP_PATH}" "${ZIP_PATH}"

          xcrun notarytool submit "${ZIP_PATH}" \
            --key "${NOTARY_KEY_PATH}" \
            --key-id "${NOTARY_KEY_ID}" \
            --issuer "${NOTARY_ISSUER_ID}" \
            --wait

          xcrun stapler staple "${APP_PATH}"
          xcrun stapler validate "${APP_PATH}"

      - name: Create unsigned DMG
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          DMG_STAGE="${RUNNER_TEMP}/dmg-stage"
          DIST_PATH="${GITHUB_WORKSPACE}/dist"
          EXPORT_PATH="${RUNNER_TEMP}/export"
          mkdir -p "${DMG_STAGE}" "${DIST_PATH}"
          ditto "${EXPORT_PATH}/${APP_NAME}.app" "${DMG_STAGE}/${APP_NAME}.app"
          hdiutil create \
            -volname "${APP_NAME}" \
            -srcfolder "${DMG_STAGE}" \
            -format UDZO \
            -ov \
            "${DIST_PATH}/${APP_NAME}-${VERSION}.dmg"

      - name: Upload DMG
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          DIST_PATH="${GITHUB_WORKSPACE}/dist"
          gh release upload \
            "${RELEASE_TAG}" \
            "${DIST_PATH}/${APP_NAME}-${RELEASE_TAG}.dmg" \
            --clobber
