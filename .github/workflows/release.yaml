---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release

on:
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: macOS release
    runs-on: macos-26
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      APP_NAME: WoodSweep
      PROJECT: WoodSweep.xcodeproj
      SCHEME: WoodSweep
      APPLE_API_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_API_KEY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}

    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Import Developer ID Application certificate
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}

      - name: Prepare App Store Connect API key
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail

          APPLE_API_KEY_PATH="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "${APPLE_API_KEY_P8_BASE64}" | base64 -D > "${APPLE_API_KEY_PATH}"
          chmod 600 "${APPLE_API_KEY_PATH}"
          echo "APPLE_API_KEY_PATH=${APPLE_API_KEY_PATH}" >> "${GITHUB_ENV}"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Validate release version
        run: |
          VERSION="${RELEASE_TAG#v}"
          grep -Fqx "MARKETING_VERSION = ${VERSION} // x-release-please-version" Config/Version.xcconfig

      - name: Archive app
        run: |
          xcodebuild \
            -project "${PROJECT}" \
            -scheme "${SCHEME}" \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "${RUNNER_TEMP}/${APP_NAME}.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${APPLE_API_KEY_PATH}" \
            -authenticationKeyID "${APPLE_API_KEY_ID}" \
            -authenticationKeyIssuerID "${APPLE_API_KEY_ISSUER_ID}" \
            archive

      - name: Export app
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath "${RUNNER_TEMP}/${APP_NAME}.xcarchive" \
            -exportPath "${RUNNER_TEMP}/export" \
            -exportOptionsPlist Config/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${APPLE_API_KEY_PATH}" \
            -authenticationKeyID "${APPLE_API_KEY_ID}" \
            -authenticationKeyIssuerID "${APPLE_API_KEY_ISSUER_ID}"

      - name: Verify Keychain signing
        run: |
          set -euo pipefail

          APP_PATH="${RUNNER_TEMP}/export/${APP_NAME}.app"
          ENTITLEMENTS_PATH="${RUNNER_TEMP}/${APP_NAME}-entitlements.plist"

          test -f "${APP_PATH}/Contents/embedded.provisionprofile"
          codesign -d --entitlements :- "${APP_PATH}" \
            > "${ENTITLEMENTS_PATH}" 2>/dev/null

          BUNDLE_IDENTIFIER="$(/usr/libexec/PlistBuddy \
            -c 'Print :CFBundleIdentifier' "${APP_PATH}/Contents/Info.plist")"
          TEAM_IDENTIFIER="$(/usr/libexec/PlistBuddy \
            -c 'Print :com.apple.developer.team-identifier' "${ENTITLEMENTS_PATH}")"
          APPLICATION_IDENTIFIER="$(/usr/libexec/PlistBuddy \
            -c 'Print :com.apple.application-identifier' "${ENTITLEMENTS_PATH}")"
          KEYCHAIN_ACCESS_GROUP="$(/usr/libexec/PlistBuddy \
            -c 'Print :keychain-access-groups:0' "${ENTITLEMENTS_PATH}")"
          EXPECTED_APPLICATION_IDENTIFIER="${TEAM_IDENTIFIER}.${BUNDLE_IDENTIFIER}"

          test "${APPLICATION_IDENTIFIER}" = "${EXPECTED_APPLICATION_IDENTIFIER}"
          test "${KEYCHAIN_ACCESS_GROUP}" = "${EXPECTED_APPLICATION_IDENTIFIER}"

      - name: Notarize app
        run: |
          set -euo pipefail

          APP_PATH="${RUNNER_TEMP}/export/${APP_NAME}.app"
          NOTARY_ARCHIVE="${RUNNER_TEMP}/${APP_NAME}-notary.zip"

          trap 'rm -f "${NOTARY_ARCHIVE}"' EXIT

          ditto -c -k --keepParent "${APP_PATH}" "${NOTARY_ARCHIVE}"

          xcrun notarytool submit "${NOTARY_ARCHIVE}" \
            --key "${APPLE_API_KEY_PATH}" \
            --key-id "${APPLE_API_KEY_ID}" \
            --issuer "${APPLE_API_KEY_ISSUER_ID}" \
            --wait

          xcrun stapler staple "${APP_PATH}"
          xcrun stapler validate "${APP_PATH}"

      - name: Verify app
        run: |
          APP_PATH="${RUNNER_TEMP}/export/${APP_NAME}.app"

          codesign --verify --deep --strict --verbose=2 "${APP_PATH}"
          spctl --assess --type execute --verbose=2 "${APP_PATH}"

      - name: Create ZIP
        run: |
          VERSION="${RELEASE_TAG#v}"

          mkdir -p dist
          ditto -c -k --keepParent \
            "${RUNNER_TEMP}/export/${APP_NAME}.app" \
            "dist/${APP_NAME}-${VERSION}.zip"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          gh release upload \
            "${RELEASE_TAG}" \
            "dist/${APP_NAME}-${VERSION}.zip" \
            --clobber

      - name: Remove App Store Connect API key
        if: ${{ always() }}
        run: rm -f "${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
