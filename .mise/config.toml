[tools]
periphery = "3.8.0"
swiftformat = "0.62.1"
lefthook = "2.1.10"
actionlint = "1.7.12"
zizmor = "1.29.0"
oxfmt = "0.63.0"
shellcheck = "0.11.0"
mkcert = "1.4.4"
kopia = "v0.23.1"
"npm:@commitlint/cli" = "21.2.1"

[settings]
experimental = true
pin = true
lockfile = true
minimum_release_age = "12 hours"

[tasks.format]
description = "Format Swift code"
run = "swiftformat WoodSweep WoodSweepTests"

[tasks.fmt-check]
description = "Check Swift formatting"
run = "swiftformat WoodSweep WoodSweepTests --lint"

[tasks.periphery]
description = "Build the app and reject unused Swift code"
run = """
periphery scan \
  --project WoodSweep.xcodeproj \
  --schemes WoodSweep \
  --format xcode \
  --strict \
  --disable-update-check \
  --relative-results \
  -- \
  -destination 'platform=macOS' \
  CODE_SIGNING_ALLOWED=NO
"""

[tasks.test]
description = "Run focused Swift tests"
run = """
xcodebuild test \
  -project WoodSweep.xcodeproj \
  -scheme WoodSweep \
  -destination 'platform=macOS' \
  CODE_SIGNING_ALLOWED=NO
"""

[tasks.dev-tls]
description = "Create a local TLS certificate for the Kopia test server"
run = """
mkdir -p .local/tls/ca
CAROOT="$PWD/.local/tls/ca" mkcert \
  -cert-file .local/tls/kopia.pem \
  -key-file .local/tls/kopia-key.pem \
  localhost 127.0.0.1 ::1 kopia
"""

[tasks.dev-tls-trust]
description = "Trust the local Kopia test CA in the macOS login Keychain"
depends = ["dev-tls"]
run = 'CAROOT="$PWD/.local/tls/ca" mkcert -install'

[tasks.kopia-server]
description = "Run the local Kopia Repository Server in the foreground"
depends = ["dev-tls"]
run = "./scripts/start-kopia-server.sh"

[tasks.shell-lint]
description = "Lint repository shell scripts"
run = "shellcheck scripts/*.sh"

[tasks.workflow-lint]
description = "Lint GitHub Actions workflows"
run = ["actionlint", "zizmor --offline --no-ignores .github/workflows"]

[tasks.lint]
description = "Run all non-test repository checks"
depends = ["fmt-check", "shell-lint", "workflow-lint", "periphery"]

[hooks]
postinstall = "lefthook install"
