[tools]
periphery = "3.8.0"
swiftformat = "0.64.7"
lefthook = "2.2.3"
jactionlint = "v2.6.0"
oxfmt = "0.75.0"
shellcheck = "0.11.0"
mkcert = "1.4.4"
kopia = "v0.23.1"

[settings]
experimental = true
pin = true
lockfile = true

[tasks.format]
run = "swiftformat WoodSweep WoodSweepTests"

[tasks.fmt-check]
run = "swiftformat WoodSweep WoodSweepTests --lint"

[tasks.build]
description = "Unsigned"
run = """
xcodebuild build \
  -project WoodSweep.xcodeproj \
  -scheme WoodSweep \
  -destination 'generic/platform=macOS' \
  CODE_SIGNING_ALLOWED=NO
"""

[tasks.periphery]
run = """
periphery scan \
  --project WoodSweep.xcodeproj \
  --schemes WoodSweep \
  --format xcode \
  --strict \
  --disable-update-check \
  --relative-results \
  -- \
  -destination 'platform=macOS' \
  CODE_SIGNING_ALLOWED=NO
"""

[tasks.test]
run = """
xcodebuild test \
  -project WoodSweep.xcodeproj \
  -scheme WoodSweep \
  -destination 'platform=macOS' \
  CODE_SIGNING_ALLOWED=NO
"""

[tasks.dev-tls]
run = """
mkdir -p .local/tls/ca
CAROOT="$PWD/.local/tls/ca" mkcert \
  -cert-file .local/tls/kopia.pem \
  -key-file .local/tls/kopia-key.pem \
  localhost 127.0.0.1 ::1 kopia
"""

[tasks.dev-tls-trust]
description = "Changes login Keychain"
depends = ["dev-tls"]
run = 'CAROOT="$PWD/.local/tls/ca" mkcert -install'

[tasks.kopia-server]
depends = ["dev-tls"]
run = "./scripts/start-kopia-server.sh"

[tasks.shell-lint]
run = "shellcheck scripts/*.sh"

[tasks.lint]
depends = ["shell-lint", "periphery"]

[hooks]
postinstall = "lefthook install"
